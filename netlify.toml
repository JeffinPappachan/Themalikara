[build]
  command = "npm run build"
  publish = "dist"

# Vite embeds public Supabase URL/anon key in the client bundle — expected, not a leak.
[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "VITE_SUPABASE_URL,VITE_SUPABASE_ANON_KEY,SUPABASE_PROJECT_REF"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
